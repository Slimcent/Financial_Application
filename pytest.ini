[pytest]
# Make the project root importable (Models, Data, Services, Infrastructure, ...).
pythonpath = .

# Only the unit tests run by default. The integration tests need a configured MySQL
# database (.env); run them explicitly with:  pytest tests/integration
testpaths = tests/unit

# pytest-asyncio: every async test and fixture gets an event loop of its own.
asyncio_default_fixture_loop_scope = function
